<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Six-Hour Clock</title>
<style>
  :root {
    --bg: #12141a;
    --face: #1b1e26;
    --rim: #3a4050;
    --ink: #e6e9f0;
    --dim: #7c8496;
    --accent: #ff6b5e;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
  }
  svg {
    width: min(80vw, 70vh);
    height: auto;
    display: block;
  }
  .face { fill: var(--face); stroke: var(--rim); stroke-width: 1.5; }
  .tick { stroke: var(--dim); stroke-width: 0.7; stroke-linecap: round; }
  .tick.major { stroke: var(--ink); stroke-width: 1.8; }
  .numeral {
    fill: var(--ink);
    font-size: 13px;
    font-weight: 600;
    text-anchor: middle;
    dominant-baseline: central;
  }
  .hand { stroke-linecap: round; }
  #hour   { stroke: var(--ink); stroke-width: 5; }
  #minute { stroke: var(--ink); stroke-width: 3; }
  #second { stroke: var(--accent); stroke-width: 1.4; }
  .pin { fill: var(--accent); }
  #readout {
    text-align: center;
    line-height: 1.6;
  }
  #cycle {
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
  }
  #wall {
    font-size: 0.95rem;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

<svg viewBox="0 0 200 200" role="img" aria-label="Six-hour analog clock">
  <circle class="face" cx="100" cy="100" r="96"/>
  <g id="ticks"></g>
  <g id="numerals"></g>
  <line class="hand" id="hour"   x1="100" y1="100" x2="100" y2="48"/>
  <line class="hand" id="minute" x1="100" y1="100" x2="100" y2="26"/>
  <line class="hand" id="second" x1="100" y1="112" x2="100" y2="22"/>
  <circle class="pin" cx="100" cy="100" r="2.6"/>
</svg>

<div id="readout">
  <div id="cycle">–</div>
  <div id="wall">–</div>
</div>

<script>
const SVG_NS = 'http://www.w3.org/2000/svg';
const CX = 100, CY = 100;

// Point at `deg` clockwise from straight up, `r` from the centre.
function polar(deg, r) {
  const rad = deg * Math.PI / 180;
  return { x: CX + r * Math.sin(rad), y: CY - r * Math.cos(rad) };
}

// 60 minute ticks; every 10th lines up with a numeral and is drawn heavy.
const ticks = document.getElementById('ticks');
for (let i = 0; i < 60; i++) {
  const major = i % 10 === 0;
  const deg = i * 6;
  const outer = polar(deg, 90);
  const inner = polar(deg, major ? 80 : 85);
  const line = document.createElementNS(SVG_NS, 'line');
  line.setAttribute('class', major ? 'tick major' : 'tick');
  line.setAttribute('x1', outer.x.toFixed(3));
  line.setAttribute('y1', outer.y.toFixed(3));
  line.setAttribute('x2', inner.x.toFixed(3));
  line.setAttribute('y2', inner.y.toFixed(3));
  ticks.appendChild(line);
}

// 6 sits at the top (360° ≡ 0°), then 1..5 clockwise at 60° apart.
const numerals = document.getElementById('numerals');
for (let n = 1; n <= 6; n++) {
  const p = polar(n * 60, 68);
  const text = document.createElementNS(SVG_NS, 'text');
  text.setAttribute('class', 'numeral');
  text.setAttribute('x', p.x.toFixed(3));
  text.setAttribute('y', p.y.toFixed(3));
  text.textContent = String(n);
  numerals.appendChild(text);
}

// Each 6-hour cycle gets its own meridiem-style designation.
const PERIODS = [
  { abbr: 'PMN', full: 'post mediam noctem' },  // 00:00–06:00
  { abbr: 'AM',  full: 'ante meridiem' },       // 06:00–12:00
  { abbr: 'PM',  full: 'post meridiem' },       // 12:00–18:00
  { abbr: 'AMN', full: 'ante mediam noctem' },  // 18:00–24:00
];

const hourHand = document.getElementById('hour');
const minuteHand = document.getElementById('minute');
const secondHand = document.getElementById('second');
const cycleOut = document.getElementById('cycle');
const wallOut = document.getElementById('wall');

const pad = v => String(v).padStart(2, '0');

function rotate(el, deg) {
  el.setAttribute('transform', `rotate(${deg.toFixed(3)} ${CX} ${CY})`);
}

function render(now) {
  const h = now.getHours();
  const m = now.getMinutes();
  const s = now.getSeconds() + now.getMilliseconds() / 1000;

  const h6 = h % 6;                                  // 0..5, shown as 6 when 0
  rotate(hourHand, (h6 + m / 60 + s / 3600) * 60);   // one revolution per 6 hours
  rotate(minuteHand, (m + s / 60) * 6);
  rotate(secondHand, s * 6);

  const period = PERIODS[Math.floor(h / 6)];
  const displayHour = h6 === 0 ? 6 : h6;
  cycleOut.textContent = `${displayHour}:${pad(m)}:${pad(now.getSeconds())} ${period.abbr}`;
  wallOut.textContent = `${period.full} · ${pad(h)}:${pad(m)}:${pad(now.getSeconds())} 24h`;
}

function frame() {
  render(new Date());
  requestAnimationFrame(frame);
}
frame();
</script>

</body>
</html>
